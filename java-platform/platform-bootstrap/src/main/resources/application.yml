spring:
  application:
    name: ai-interview-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${AI_INTERVIEW_SESSION_COOKIE_SECURE:false}
        same-site: lax

# Actuator 仅暴露 health 和 prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

# AI Interview 平台配置 — 全部由环境变量覆盖
ai-interview:
  db:
    url: ${AI_INTERVIEW_DB_URL:jdbc:mysql://localhost:3306/ai_interview}
    username: ${AI_INTERVIEW_DB_USERNAME:}
    password: ${AI_INTERVIEW_DB_PASSWORD:}
  redis:
    host: ${AI_INTERVIEW_REDIS_HOST:localhost}
    port: ${AI_INTERVIEW_REDIS_PORT:6379}
    password: ${AI_INTERVIEW_REDIS_PASSWORD:}
  rabbitmq:
    host: ${AI_INTERVIEW_RABBITMQ_HOST:localhost}
    port: ${AI_INTERVIEW_RABBITMQ_PORT:5672}
    username: ${AI_INTERVIEW_RABBITMQ_USERNAME:}
    password: ${AI_INTERVIEW_RABBITMQ_PASSWORD:}
    virtual-host: ${AI_INTERVIEW_RABBITMQ_VHOST:/}
  minio:
    endpoint: ${AI_INTERVIEW_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${AI_INTERVIEW_MINIO_ACCESS_KEY:}
    secret-key: ${AI_INTERVIEW_MINIO_SECRET_KEY:}
    bucket: ${AI_INTERVIEW_MINIO_BUCKET:ai-interview-files}
  security:
    allowed-origins: ${AI_INTERVIEW_SECURITY_ALLOWED_ORIGINS:http://localhost:8080}

logging:
  level:
    com.aiinterview: INFO
